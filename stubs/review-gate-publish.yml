name: Review gate publisher
on:
  workflow_run:
    workflows: ["Review gate"]
    types: [completed]
permissions:
  actions: read
  statuses: write
  pull-requests: write
  contents: read
concurrency:
  group: review-gate-publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true
jobs:
  target:
    if: github.event.workflow_run.event != 'workflow_run'
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.target.outputs.pr }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        continue-on-error: true # Older/restricted runs may have no artifact.
        with:
          name: review-gate-target
          path: ${{ runner.temp }}/review-gate-target
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - id: target
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          try {
            const t = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/review-gate-target/review-gate-target.json`, 'utf8'));
            if (Number.isSafeInteger(t?.pr) && t.pr > 0 && typeof t.sha === 'string' && /^[a-f0-9]{40}$/i.test(t.sha))
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `pr=${t.pr}\n`);
          } catch { console.log('No valid target artifact; using SHA/branch fallback.'); }
          NODE
  publish:
    needs: target
    if: github.event.workflow_run.event != 'workflow_run'
    uses: wcpos/.github/.github/workflows/review-gate.yml@main
    with:
      pr: ${{ fromJSON(needs.target.outputs.pr || '0') }}
      sha: ${{ !needs.target.outputs.pr && github.event.workflow_run.head_sha || '' }}
      head_owner: ${{ github.event.workflow_run.head_repository.owner.login }}
      head_branch: ${{ github.event.workflow_run.head_branch }}
