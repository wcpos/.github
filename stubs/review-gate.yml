name: Review gate
on:
  # pull_request_target: the reusable workflow checks out ONLY wcpos/.github's trusted code,
  # never the PR's, so the writable base-context token is safe here and lets the gate
  # publish the status on fork and Dependabot PRs too (pull_request gives them a read-only token).
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_thread:
    types: [resolved, unresolved]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
permissions:
  statuses: write
  contents: read
  pull-requests: write
jobs:
  gate:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    uses: wcpos/.github/.github/workflows/review-gate.yml@main
