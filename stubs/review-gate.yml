name: Review gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to evaluate
        required: true
        type: number
permissions:
  statuses: write
  contents: read
  pull-requests: write
jobs:
  gate:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    uses: wcpos/.github/.github/workflows/review-gate.yml@main
    with:
      pr: ${{ inputs.pr || 0 }}
