name: Dependabot Auto-Merge

on:
  workflow_call:
    inputs:
      merge-with-app-token:
        # A merge made with GITHUB_TOKEN never triggers the caller's `push`
        # workflows, so a repo whose main-branch CI rebuilds or releases on
        # every merge (wcpos/wp-admin-landing) silently skips that step for
        # Dependabot merges. Opt in to have the app token enable auto-merge,
        # so the merge triggers workflows like any other.
        description: Enable auto-merge with the app token so the merge triggers push workflows.
        type: boolean
        default: false
    secrets:
      PROJECT_BOT_APP_ID:
        required: true
      PROJECT_BOT_PRIVATE_KEY:
        required: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@ffa630c65fa7e0ecfa0625b5ceda64399aea1b36 # v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Generate GitHub App token
        id: app-token
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PROJECT_BOT_APP_ID }}
          private-key: ${{ secrets.PROJECT_BOT_PRIVATE_KEY }}

      - name: Approve PR
        if: steps.metadata.outputs.update-type != 'version-update:semver-major' && steps.app-token.outcome == 'success'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ inputs.merge-with-app-token && steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
