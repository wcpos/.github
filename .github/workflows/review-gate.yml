name: Review gate
on:
  workflow_call:
permissions:
  statuses: write
  pull-requests: write
  contents: read
concurrency:
  group: review-gate-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true
jobs:
  review-gate:
    name: review-gate
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      # Only trusted central code; never execute the PR's checkout with this token.
      - uses: actions/checkout@v7.0.1
        with:
          repository: wcpos/.github
          ref: main
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '20'
      - name: Evaluate reviews
        run: node scripts/review-gate.mjs --workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
